plugins { id 'com.android.application' }
android {
    namespace 'com.luben.asistencia'
    compileSdk 35
    defaultConfig {
        applicationId 'com.luben.asistencia'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
